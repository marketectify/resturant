# Builds the client and publishes ONLY the built files to the `hostinger-demo` branch.
# Hostinger (cron `git fetch` + `git reset --hard`) then serves that branch.
# Runs on every push to main, so merging a pull request updates the live demo.
name: Build demo for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to push the hostinger-demo branch

concurrency:
  group: hostinger-demo
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build the client
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Publish client/dist to the hostinger-demo branch
        run: |
          cd client/dist
          cat > README.md <<'EOT'
          # Master Foods demo (built files)

          Generated automatically by .github/workflows/deploy-demo.yml from the main branch.
          Do not edit by hand: the next push to main replaces everything here.
          EOT
          git init -q -b hostinger-demo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger-demo
