<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1df"/>
      <stop offset="0.55" stop-color="#f6e6cc"/>
      <stop offset="1" stop-color="#efd5b3"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0%" cy="100%" r="65%">
      <stop offset="0" stop-color="#ae2a32" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ae2a32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="100%" cy="0%" r="60%">
      <stop offset="0" stop-color="#f5b94a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f5b94a" stop-opacity="0"/>
    </radialGradient>
    <!-- repeating tile: spice motifs (chilli, leaf, star anise, dots) -->
    <pattern id="tile" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <g fill="none" stroke="#a5472f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".16">
        <path d="M30 40c26-4 52 6 60 24 3 7-3 11-8 8-12-6-26-8-42-9-9-1-16-7-10-23z"/>
        <path d="M30 40c-3-7-1-12 5-15"/>
        <path d="M130 30c0 22-14 38-38 40 0-24 14-40 38-40zM130 30c-10 10-26 24-38 40"/>
        <g transform="translate(150 140)">
          <path d="M0-22 5-6 22 0 5 6 0 22-5 6-22 0-5-6z"/>
          <circle r="4"/>
        </g>
        <circle cx="60" cy="140" r="14"/><circle cx="60" cy="140" r="6"/>
        <path stroke-width="5" d="M110 110h.01M20 100h.01M170 80h.01M96 176h.01"/>
      </g>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#tile)"/>
  <rect width="1600" height="900" fill="url(#redGlow)"/>
  <rect width="1600" height="900" fill="url(#goldGlow)"/>
  <!-- soft plate rings in the corners -->
  <g fill="none" stroke="#ae2a32" stroke-opacity=".10" stroke-width="3">
    <circle cx="1560" cy="860" r="260"/><circle cx="1560" cy="860" r="225"/>
    <circle cx="20" cy="40" r="210"/><circle cx="20" cy="40" r="178"/>
  </g>
</svg>
